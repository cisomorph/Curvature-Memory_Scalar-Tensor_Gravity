name: Create Wiki Pages
on:
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Push wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          cd wiki
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          cp -f ../_wiki/*.md .
          git add .
          git diff --cached --quiet || git commit -m "Create CMSTG wiki: Home, Framework, Simulation Programme, No-Go Theorems, Papers, Predictions"
          git push
