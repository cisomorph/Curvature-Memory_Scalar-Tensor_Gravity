params:
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.00015
    proposal: 0.0001
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    ref:
      dist: norm
      loc: 0.12
      scale: 0.0012
    proposal: 0.001
    renames:
    - omegach2
  H0:
    prior:
      min: 50.0
      max: 85.0
    ref:
      dist: norm
      loc: 67.5
      scale: 0.6
    proposal: 0.5
  logA:
    prior:
      min: 2.9
      max: 3.2
    ref:
      dist: norm
      loc: 3.044
      scale: 0.014
    proposal: 0.01
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.9
      max: 1.05
    ref:
      dist: norm
      loc: 0.9649
      scale: 0.004
    proposal: 0.003
    renames:
    - ns
  tau_reio:
    prior:
      min: 0.02
      max: 0.1
    ref:
      dist: norm
      loc: 0.054
      scale: 0.007
    proposal: 0.005
    renames:
    - tau
  w0_fld:
    prior:
      min: -2.0
      max: 0.0
    ref:
      dist: norm
      loc: -0.8
      scale: 0.1
    proposal: 0.05
    renames:
    - w
  wa_fld:
    prior:
      min: -3.0
      max: 2.0
    ref:
      dist: norm
      loc: -0.6
      scale: 0.3
    proposal: 0.1
    renames:
    - wa
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_\mathrm{cal}
    renames: calPlanck
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
sampler:
  minimize:
    method: bobyqa
    ignore_prior: false
    max_evals: 3000
    best_of: 1
    confidence_for_unbounded: 0.9999995
